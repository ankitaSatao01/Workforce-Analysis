<!DOCTYPE html>
<html>
<head>
    <title>Workforce Demand</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        .add-btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background-color: #34495e;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .edit {
            background-color: #f39c12;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete {
            background-color: #e74c3c;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #34495e;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Workforce Demand Management</h2>

    <a href="/workforce-demand/add" class="add-btn">
        + Add Workforce Demand
    </a>

    <table>

        <tr>
            <th>Demand ID</th>
            <th>Month</th>
            <th>Skill</th>
            <th>Required Employees</th>
            <th>Actions</th>
        </tr>

        {% for demand in demands %}

        <tr>

            <td>{{ demand.demand_id }}</td>

            <td>{{ demand.demand_month }}</td>

            <td>{{ demand.skill_name }}</td>

            <td>{{ demand.required_employees }}</td>

            <td>

                <a href="/workforce-demand/edit/{{ demand.demand_id }}"
                   class="edit">
                    Edit
                </a>

                <a href="/workforce-demand/delete/{{ demand.demand_id }}"
                   class="delete"
                   onclick="return confirm('Are you sure you want to delete this demand record?');">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    <a href="/" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
