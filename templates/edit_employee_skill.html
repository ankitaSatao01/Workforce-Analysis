<!DOCTYPE html>
<html>
<head>
    <title>Edit Employee Skill</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input {
            background-color: #eee;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #f39c12;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d68910;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Employee Skill</h2>

    <form method="POST">

        <label>Employee</label>

        <input type="text"
               value="{{ mapping.employee_name }}"
               readonly>


        <label>Skill</label>

        <input type="text"
               value="{{ mapping.skill_name }}"
               readonly>


        <label>Proficiency Level</label>

        <select name="proficiency_level" required>

            <option value="Beginner"
                {% if mapping.proficiency_level == "Beginner" %}
                    selected
                {% endif %}>
                Beginner
            </option>

            <option value="Intermediate"
                {% if mapping.proficiency_level == "Intermediate" %}
                    selected
                {% endif %}>
                Intermediate
            </option>

            <option value="Advanced"
                {% if mapping.proficiency_level == "Advanced" %}
                    selected
                {% endif %}>
                Advanced
            </option>

        </select>


        <button type="submit">
            Update Skill
        </button>

    </form>

    <a href="/employee-skills" class="back">
        ← Back to Employee Skills
    </a>

</div>

</body>
</html>
